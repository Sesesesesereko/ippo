# コードが置かれるたびに：土台の準備 → 部品のインストール → チェック → Web版を公開
name: Check and publish web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Expo project (first run creates package.json)
        run: node scripts/bootstrap.js

      - name: Install packages
        run: npm install

      - name: Save generated project files to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- dist node_modules || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update generated Expo project files [skip ci]"
            git push
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Logic check
        run: npx --yes tsx scripts/check-logic.ts

      - name: Export web
        run: npx expo export --platform web

      - name: Add 404 page for single-page app
        run: cp dist/index.html dist/404.html

      - name: Try the main actions in a real browser
        id: smoke
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs

      - name: Save screenshots to the screenshots branch
        if: always() && steps.smoke.outcome != 'skipped'
        run: |
          cd ci-screens
          echo "${GITHUB_SHA}" > commit.txt
          git init -q -b screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "screens for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
